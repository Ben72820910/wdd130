<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rapid River Rafting for questions, reservations, and information about our exciting white water rafting adventures.">
    <meta name="author" content="Claire Ann Alphonse">
    <title>Contact Us | Rapid River Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rapid River Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">
            <h2>Company Information</h2>

            <p><strong>Address:</strong> 123 River Road, Jackson, Wyoming</p>
            <p><strong>Phone:</strong> (555) 123-4567</p>
            <p><strong>Email:</strong> info@rapidriverrafting.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=YOUR-GOOGLE-MAP-LINK" loading="lazy"
              allowfullscreen>
            </iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/guide1.jpg" alt="Sarah Johnson">
                <figcaption>Sarah Johnson - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/guide2.jpg" alt="Michael Brown">
                <figcaption>Michael Brown - Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/guide3.jpg" alt="Emily Davis">
                <figcaption>Emily Davis - Reservation Specialist</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message</p>

                <label for="general">
                    <input type="radio" id="general" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label for="reservation">
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label for="website">
                    <input type="radio" id="website" name="purpose" value="website">
                    Website Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rapid River Rafting | Claire Ann Alphonse</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
